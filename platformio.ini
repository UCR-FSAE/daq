; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino

monitor_speed = 115200
; real firmware: everything in src/ except the SD bench test
build_src_filter = +<*> -<bench/>
; puts the git commit into every SD log header
extra_scripts = pre:tools/pio_git_hash.py
; SD logger options (see include/SDLogger.h), e.g.:
;   -D SDLOG_FILE_BYTES=33554432   (32 MiB parts)
;   -D SDLOG_DELETE_OLDEST=1       (OFF by default: never delete logs)

; SD logger bench test (fake sensors, no real peripherals needed)
; build/upload with: pio run -e teensy41_sdbench -t upload
[env:teensy41_sdbench]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<main.cpp>
extra_scripts = pre:tools/pio_git_hash.py
; small parts so rotation happens within a few minutes on the bench
build_flags = -D SDLOG_FILE_BYTES=4194304 -D SDLOG_FILE_MAX_MS=60000 -D DAQ_BENCH=1
